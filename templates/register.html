{{template "header" .}}
<h2><a href="/events/{{.Event.ID}}">{{.Event.Title}}</a></h2>
<p>{{.Event.Date}} · {{.Event.Location}}</p>
<p>Свободных мест: {{.Event.Available}}</p>
{{if gt .Event.Available 0}}
<form action="/events/{{.Event.ID}}/register" method="post" class="data-form">
    <label for="name">Имя участника</label>
    <input id="name" name="name" type="text" value="{{.Form.Get "name"}}" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{.Form.Get "email"}}" required>

    <button type="submit">Зарегистрироваться</button>
</form>
{{else}}
<p>Свободных мест нет.</p>
{{end}}
<p class="links">
    <a href="/events/{{.Event.ID}}">О мероприятии</a>
    <a href="/events/{{.Event.ID}}/participants">Список участников</a>
</p>
{{template "footer" .}}
